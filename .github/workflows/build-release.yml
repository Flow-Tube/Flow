name: Build release APK

# Manual run: Actions -> "Build release APK" -> Run workflow.
# Signed when the RELEASE_KEYSTORE_BASE64 secret exists, otherwise the APK is
# unsigned (the same fallback app/build.gradle.kts uses without a keystore).
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor to build'
        type: choice
        default: Foss
        options:
          - Foss
          - Github

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build release
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set. Building an UNSIGNED release APK."
          fi

      - name: Build release APK
        run: ./gradlew :app:assemble${{ inputs.flavor }}Release --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ inputs.flavor }}-release-${{ steps.keystore.outputs.signed == 'true' && 'signed' || 'unsigned' }}-${{ github.sha }}
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
          retention-days: 30
